<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div>
            <input type="text" id="display" readonly />    

            <div class="first-line">
                <button class="light-gray" data-action="clear">C</button>
                <button class="light-gray" data-action="negate">+/-</button>
                <button class="light-gray" data-action="percent">%</button>
                <button class="orange" data-op="/">/</button>
            </div>
            <div class="second-line">
                <button class="dark-gray" data-num="7">7</button>
                <button class="dark-gray" data-num="8">8</button>
                <button class="dark-gray" data-num="9">9</button>
                <button class="orange" data-op="*">*</button>
            </div>
            <div class="third-line">
                <button class="dark-gray" data-num="4">4</button>
                <button class="dark-gray" data-num="5">5</button>
                <button class="dark-gray" data-num="6">6</button>
                <button class="orange" data-op="-">-</button>
            </div>
            <div class="fourth-line">
                <button class="dark-gray" data-num="1">1</button>
                <button class="dark-gray" data-num="2">2</button>
                <button class="dark-gray" data-num="3">3</button>
                <button class="orange" data-op="+">+</button>
            </div>
            <div class="fifth-line">
                <button class="zero dark-gray" data-num="0">0</button>
                <button class="dark-gray" data-num=".">.</button>
                <button class="orange" data-action="equals">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
